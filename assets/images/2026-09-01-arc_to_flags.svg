<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1f2937; }
      .title { font-size: 25px; font-weight: bold; }
      .label { font-size: 18px; font-weight: bold; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>
  <text x="450" y="38" text-anchor="middle" class="title">
    arc_to: large_arc and sweep
  </text>
  <text x="450" y="64" text-anchor="middle" class="small">
    Same start point, endpoint, and radii in every example
  </text>

  <!-- Panel 1: small, counterclockwise. -->
  <g transform="translate(40,95)">
    <rect width="390" height="245" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="195" y="30" text-anchor="middle" class="label">large_arc = false</text>
    <text x="195" y="53" text-anchor="middle" class="small">sweep = false</text>
    <path d="M290 145 A130 80 0 0 0 100 145" fill="none" stroke="#2563eb" stroke-width="6"/>
    <circle cx="290" cy="145" r="6" fill="#111827"/>
    <circle cx="100" cy="145" r="6" fill="#111827"/>
    <text x="295" y="137" class="small">start</text>
    <text x="43" y="137" class="small">to</text>
    <text x="195" y="112" text-anchor="middle" class="small" fill="#2563eb">short arc</text>
  </g>

  <!-- Panel 2: small, clockwise. -->
  <g transform="translate(470,95)">
    <rect width="390" height="245" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="195" y="30" text-anchor="middle" class="label">large_arc = false</text>
    <text x="195" y="53" text-anchor="middle" class="small">sweep = true</text>
    <path d="M290 145 A130 80 0 0 1 100 145" fill="none" stroke="#16a34a" stroke-width="6"/>
    <circle cx="290" cy="145" r="6" fill="#111827"/>
    <circle cx="100" cy="145" r="6" fill="#111827"/>
    <text x="295" y="137" class="small">start</text>
    <text x="43" y="137" class="small">to</text>
    <text x="195" y="195" text-anchor="middle" class="small" fill="#16a34a">short arc</text>
  </g>

  <!-- Panel 3: large, counterclockwise. -->
  <g transform="translate(40,375)">
    <rect width="390" height="245" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="195" y="30" text-anchor="middle" class="label">large_arc = true</text>
    <text x="195" y="53" text-anchor="middle" class="small">sweep = false</text>
    <path d="M275 145 A100 55 0 1 0 115 145" fill="none" stroke="#9333ea" stroke-width="6"/>
    <circle cx="275" cy="145" r="6" fill="#111827"/>
    <circle cx="115" cy="145" r="6" fill="#111827"/>
    <text x="280" y="137" class="small">start</text>
    <text x="58" y="137" class="small">to</text>
    <text x="195" y="102" text-anchor="middle" class="small" fill="#9333ea">long arc (&gt; 180°)</text>
  </g>

  <!-- Panel 4: large, clockwise. -->
  <g transform="translate(470,375)">
    <rect width="390" height="245" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="195" y="30" text-anchor="middle" class="label">large_arc = true</text>
    <text x="195" y="53" text-anchor="middle" class="small">sweep = true</text>
    <path d="M275 145 A100 55 0 1 1 115 145" fill="none" stroke="#ea580c" stroke-width="6"/>
    <circle cx="275" cy="145" r="6" fill="#111827"/>
    <circle cx="115" cy="145" r="6" fill="#111827"/>
    <text x="280" y="137" class="small">start</text>
    <text x="58" y="137" class="small">to</text>
    <text x="195" y="195" text-anchor="middle" class="small" fill="#ea580c">long arc (&gt; 180°)</text>
  </g>

  <text x="450" y="665" text-anchor="middle" class="small">
    large_arc chooses short (&lt; 180°) or long (&gt; 180°); sweep chooses direction
  </text>
</svg>
