<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="currentColor"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1f2937; }
      .label { font-size: 18px; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>
  <text x="360" y="34" text-anchor="middle" font-size="24" font-weight="bold">
    arc_to: two semicircles forming a circle
  </text>

  <!-- Coordinate axes; SVG y increases downward. -->
  <line x1="90" y1="230" x2="630" y2="230" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <line x1="360" y1="70" x2="360" y2="390" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <text x="638" y="235" class="small">+x</text>
  <text x="366" y="80" class="small">-y</text>
  <text x="366" y="407" class="small">+y</text>

  <!-- Oval with rx = 180 and ry = 110. -->
  <ellipse cx="360" cy="230" rx="180" ry="110"
           fill="#dbeafe" fill-opacity="0.65" stroke="none"/>

  <!-- Center. -->
  <circle cx="360" cy="230" r="5" fill="#111827"/>
  <text x="372" y="252" class="small">center</text>

  <!-- Horizontal radius rx. -->
  <line x1="360" y1="230" x2="540" y2="230"
        stroke="#dc2626" stroke-width="3"
        marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="450" y="218" text-anchor="middle" class="label" fill="#dc2626">radius_x = 180</text>

  <!-- Vertical radius ry. -->
  <line x1="360" y1="230" x2="360" y2="340"
        stroke="#16a34a" stroke-width="3"
        marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="375" y="298" class="label" fill="#16a34a">radius_y = 110</text>

  <!-- Two arc_to calls: top semicircle, then bottom semicircle. -->
  <path d="M540 230 A180 110 0 0 0 180 230"
        fill="none" stroke="#9333ea" stroke-width="7"/>
  <path d="M180 230 A180 110 0 0 0 540 230"
        fill="none" stroke="#f97316" stroke-width="7"/>
  <circle cx="540" cy="230" r="7" fill="#111827"/>
  <circle cx="180" cy="230" r="7" fill="#111827"/>
  <text x="545" y="220" class="small">start</text>
  <text x="125" y="220" class="small">endpoint</text>
  <text x="360" y="100" text-anchor="middle" class="label" fill="#9333ea">first arc: top semicircle</text>
  <text x="360" y="365" text-anchor="middle" class="label" fill="#f97316">second arc: bottom semicircle</text>

  <!-- Matching callout. -->
  <rect x="120" y="410" width="480" height="36" rx="8" fill="#f3f4f6"/>
  <text x="360" y="434" text-anchor="middle" class="small">
    arc_to(point(radius_x, radius_y), 0.0, false, false, endpoint)
  </text>
</svg>
